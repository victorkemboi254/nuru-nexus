<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none" class="company-logo-svg company-logo--pentapath">
  <!-- 5 Radiating Spokes -->
  <g fill="#0F273D">
    <!-- Center spoke (90 deg / straight up) -->
    <rect x="257" y="24" width="26" height="92" rx="4" />
    <!-- Diagonal spokes left -->
    <rect x="257" y="24" width="26" height="92" rx="4" transform="rotate(-40 270 144)" />
    <rect x="257" y="24" width="26" height="92" rx="4" transform="rotate(-80 270 144)" />
    <!-- Diagonal spokes right -->
    <rect x="257" y="24" width="26" height="92" rx="4" transform="rotate(40 270 144)" />
    <rect x="257" y="24" width="26" height="92" rx="4" transform="rotate(80 270 144)" />
  </g>
  
  <!-- Cutout Gap behind Red Chevron to separate it cleanly from the spokes -->
  <path d="M202 196 L270 112 L338 196" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Red Chevron / Roof -->
  <path d="M202 196 L270 112 L338 196" fill="none" stroke="#E52535" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Wordmark "Pentapath" -->
  <text x="270" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
    <tspan fill="#0F273D" font-weight="800" font-size="76" letter-spacing="-0.02em">Penta</tspan>
    <tspan fill="#E52535" font-weight="800" font-size="76" letter-spacing="-0.02em">path</tspan>
  </text>
  
  <!-- Subtext "GROUP LIMITED" -->
  <text x="270" y="336" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="0.25em" fill="#E52535">
    GROUP LIMITED
  </text>
</svg>