<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none" class="company-logo-svg company-logo--pentapath">
  <!-- 5 Radiating Spokes -->
  <g fill="#0F273D">
    <!-- Center spoke (90 deg / straight up) -->
    <rect x="257" y="28" width="26" height="88" rx="6" />
    <!-- Diagonal spokes left -->
    <rect x="257" y="28" width="26" height="88" rx="6" transform="rotate(-38 270 144)" />
    <rect x="257" y="28" width="26" height="88" rx="6" transform="rotate(-74 270 144)" />
    <!-- Diagonal spokes right -->
    <rect x="257" y="28" width="26" height="88" rx="6" transform="rotate(38 270 144)" />
    <rect x="257" y="28" width="26" height="88" rx="6" transform="rotate(74 270 144)" />
  </g>
  
  <!-- Red Chevron / Roof -->
  <path d="M208 190 L270 114 L332 190" fill="none" stroke="#E52535" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Wordmark "Pentapath" -->
  <text x="270" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
    <tspan fill="#0F273D" font-weight="800" font-size="78" letter-spacing="-0.01em">Penta</tspan>
    <tspan fill="#E52535" font-weight="800" font-size="78" letter-spacing="-0.01em">path</tspan>
  </text>
  
  <!-- Subtext "GROUP LIMITED" -->
  <text x="270" y="334" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="0.22em" fill="#E52535">
    GROUP LIMITED
  </text>
</svg>